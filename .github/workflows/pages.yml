# Mobil-Build auf GitHub Pages veröffentlichen (Auftrag V3, Phase 7).
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mobil-Build (Figuren und Stimmen liegen verarbeitet im Repository)
        run: node tools/build.mjs --target mobile
      - name: Desktop-Datei zum Herunterladen beilegen
        run: |
          node tools/build.mjs
          cp dist/BOKU_TicTacTierernaehrung_v3.html dist/mobile/
          cp dist/BOKU_TicTacTierernaehrung_v3_mobile.zip dist/mobile/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mobile
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
